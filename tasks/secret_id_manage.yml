---
# role: openbao_config
# file: tasks/secret_id_manage.yml

- name: OPENBAO_CONFIG | Read the explicitly selected Secret ID
  ansible.builtin.uri:
    url: >-
      {{ openbao_config_url }}/v1/auth/{{ openbao_config_secret_id_mount
      }}/role/{{ openbao_config_secret_id_role }}/secret-id/lookup
    method: POST
    body:
      secret_id: "{{ openbao_config_secret_id_value }}"
    status_code: [200, 204, 404]
  register: __openbao_config_secret_id_read
  no_log: true
  check_mode: false

- name: OPENBAO_CONFIG | Register a missing Secret ID
  when:
    - openbao_config_secret_id_state == 'present'
    - __openbao_config_secret_id_read.status != 200
  block:
    - name: OPENBAO_CONFIG | Report the planned Secret ID registration
      ansible.builtin.debug:
        msg: "Would register a Secret ID for {{ openbao_config_secret_id_mount }}/{{ openbao_config_secret_id_role }}."
      changed_when: true
      when: ansible_check_mode

    - name: OPENBAO_CONFIG | Create the selected Secret ID
      ansible.builtin.uri:
        url: >-
          {{ openbao_config_url }}/v1/auth/{{ openbao_config_secret_id_mount
          }}/role/{{ openbao_config_secret_id_role }}/custom-secret-id
        method: POST
        body:
          secret_id: "{{ openbao_config_secret_id_value }}"
      no_log: true
      changed_when: true

- name: OPENBAO_CONFIG | Verify the registered Secret ID
  when:
    - openbao_config_secret_id_state == 'present'
    - openbao_config_secret_id_verify
    - not ansible_check_mode
  block:
    - name: OPENBAO_CONFIG | Log in with the registered Secret ID
      ansible.builtin.uri:
        url: "{{ openbao_config_url }}/v1/auth/{{ openbao_config_secret_id_mount }}/login"
        method: POST
        headers: {}
        body:
          role_id: "{{ openbao_config_secret_id_role_id }}"
          secret_id: "{{ openbao_config_secret_id_value }}"
      register: __openbao_config_secret_id_login
      no_log: true

    - name: OPENBAO_CONFIG | Revoke the Secret ID verification token
      ansible.builtin.uri:
        url: "{{ openbao_config_url }}/v1/auth/token/revoke-self"
        method: POST
        headers:
          X-Vault-Token: "{{ __openbao_config_secret_id_login.json.auth.client_token }}"
        status_code: 204
      no_log: true

- name: OPENBAO_CONFIG | Revoke an explicitly absent Secret ID
  when:
    - openbao_config_secret_id_state == 'absent'
    - __openbao_config_secret_id_read.status == 200
  block:
    - name: OPENBAO_CONFIG | Report the planned Secret ID revocation
      ansible.builtin.debug:
        msg: "Would revoke the selected Secret ID for {{ openbao_config_secret_id_role }}."
      changed_when: true
      when: ansible_check_mode

    - name: OPENBAO_CONFIG | Destroy the selected Secret ID
      ansible.builtin.uri:
        url: >-
          {{ openbao_config_url }}/v1/auth/{{ openbao_config_secret_id_mount
          }}/role/{{ openbao_config_secret_id_role }}/secret-id/destroy
        method: POST
        body:
          secret_id: "{{ openbao_config_secret_id_value }}"
        status_code: 204
      no_log: true
      changed_when: true
