---
# role: openbao_config
# file: tasks/assert.yml

- name: OPENBAO_CONFIG | Validate the API address and authentication mount
  ansible.builtin.assert:
    that:
      - openbao_config_url is match('^https://[^/@?#\\s]+$')
      - openbao_config_auth_mount is match('^[a-z][a-z0-9_-]*$')
    quiet: true

- name: OPENBAO_CONFIG | Validate configuration ownership and resource inputs
  when: __openbao_config_operation == 'configure'
  block:
    - name: OPENBAO_CONFIG | Validate policy names and ownership
      ansible.builtin.assert:
        that:
          - __openbao_config_policy.name is match('^[a-z][a-z0-9_-]*$')
          - __openbao_config_policy.name not in ['root', 'default', 'ansible-admin']
          - >-
            (__openbao_config_policy.state | default('present')) == 'absent'
            or __openbao_config_policy.rules is defined
        quiet: true
      loop: "{{ openbao_config_policies }}"
      loop_control:
        loop_var: __openbao_config_policy
        label: "{{ __openbao_config_policy.name }}"

    - name: OPENBAO_CONFIG | Validate mount paths and ownership
      ansible.builtin.assert:
        that:
          - __openbao_config_mount.path is match('^[a-z][a-z0-9_-]*$')
          - __openbao_config_mount.path not in ['ansible', 'token', 'sys', 'identity', 'cubbyhole']
          - __openbao_config_mount.path != openbao_config_auth_mount
        quiet: true
      loop: "{{ openbao_config_auth_methods + openbao_config_secrets_engines }}"
      loop_control:
        loop_var: __openbao_config_mount
        label: "{{ __openbao_config_mount.path }}"

    - name: OPENBAO_CONFIG | Validate AppRole names and ownership
      ansible.builtin.assert:
        that:
          - __openbao_config_approle.name is match('^[a-z][a-z0-9_-]*$')
          - (__openbao_config_approle.mount | default('approle')) is match('^[a-z][a-z0-9_-]*$')
          - (__openbao_config_approle.mount | default('approle')) not in ['ansible', openbao_config_auth_mount]
          - >-
            (__openbao_config_approle.state | default('present')) == 'absent'
            or __openbao_config_approle.token_policies is defined
        quiet: true
      loop: "{{ openbao_config_approles }}"
      loop_control:
        loop_var: __openbao_config_approle
        label: "{{ __openbao_config_approle.name }}"

    - name: OPENBAO_CONFIG | Validate CIDR host representation
      ansible.builtin.assert:
        that:
          - __openbao_config_cidr is not search('/(32|128)$')
        fail_msg: "Use the API representation for {{ __openbao_config_cidr }}: host addresses must omit /32 and /128."
        quiet: true
      loop: >-
        {{ (openbao_config_approles | map(attribute='secret_id_bound_cidrs', default=[]) | flatten)
        + ((openbao_config_approles + openbao_config_users) | map(attribute='token_bound_cidrs', default=[]) | flatten) }}
      loop_control:
        loop_var: __openbao_config_cidr
        label: "{{ __openbao_config_cidr }}"

    - name: OPENBAO_CONFIG | Validate unique resource definitions
      ansible.builtin.assert:
        that:
          - openbao_config_policies | map(attribute='name') | unique | length == openbao_config_policies | length
          - openbao_config_auth_methods | map(attribute='path') | unique | length == openbao_config_auth_methods | length
          - openbao_config_secrets_engines | map(attribute='path') | unique | length == openbao_config_secrets_engines | length
          - >-
            openbao_config_approles | map(attribute='mount', default='approle')
            | zip(openbao_config_approles | map(attribute='name')) | unique | length == openbao_config_approles | length
        quiet: true

    - name: OPENBAO_CONFIG | Validate unique KV paths and user names
      ansible.builtin.assert:
        that:
          - >-
            openbao_config_kv_secrets | map(attribute='mount') | zip(openbao_config_kv_secrets | map(attribute='path'))
            | unique | length == openbao_config_kv_secrets | length
          - >-
            openbao_config_users | map(attribute='mount') | zip(openbao_config_users | map(attribute='name'))
            | unique | length == openbao_config_users | length
        quiet: true

    - name: OPENBAO_CONFIG | Validate userpass names and ownership
      ansible.builtin.assert:
        that:
          - __openbao_config_user.name is match('^[a-z0-9_]([a-z0-9_.-]*[a-z0-9_-])?$')
          - __openbao_config_user.mount is match('^[a-z][a-z0-9_-]*$')
          - __openbao_config_user.mount not in ['ansible', 'token', openbao_config_auth_mount]
          - >-
            (__openbao_config_user.state | default('present')) == 'absent'
            or __openbao_config_user.token_policies is defined
        quiet: true
      vars:
        __openbao_config_user: "{{ openbao_config_users[__openbao_config_user_index] }}"
      loop: "{{ range(openbao_config_users | length) | list }}"
      loop_control:
        loop_var: __openbao_config_user_index
        label: "{{ __openbao_config_user.mount }}/{{ __openbao_config_user.name }}"

    - name: OPENBAO_CONFIG | Validate each managed KV secret before mutation
      ansible.builtin.include_tasks: assert_kv.yml
      vars:
        __openbao_config_kv_secret: "{{ openbao_config_kv_secrets[__openbao_config_kv_index] }}"
      loop: "{{ range(openbao_config_kv_secrets | length) | list }}"
      loop_control:
        loop_var: __openbao_config_kv_index
        label: "{{ __openbao_config_kv_secret.mount }}/{{ __openbao_config_kv_secret.path }}"

- name: OPENBAO_CONFIG | Validate explicit Secret ID operation inputs
  ansible.builtin.assert:
    that:
      - openbao_config_secret_id_value is defined
      - openbao_config_secret_id_mount is match('^[a-z][a-z0-9_-]*$')
      - openbao_config_secret_id_role is match('^[a-z][a-z0-9_-]*$')
      - >-
        openbao_config_secret_id_state == 'absent' or not openbao_config_secret_id_verify
        or openbao_config_secret_id_role_id is defined
    quiet: true
  when: __openbao_config_operation == 'secret_id_manage'

- name: OPENBAO_CONFIG | Protect the currently used Secret ID
  ansible.builtin.assert:
    that:
      - openbao_config_secret_id_value | length >= 32
      - openbao_config_secret_id_state != 'absent' or openbao_config_secret_id_value != openbao_config_secret_id
    quiet: true
  no_log: true
  when: __openbao_config_operation == 'secret_id_manage'
