---
# role: openbao_config
# file: tasks/approle.yml

- name: OPENBAO_CONFIG | Read the application AppRole
  ansible.builtin.uri:
    url: >-
      {{ openbao_config_url }}/v1/auth/{{ __openbao_config_approle.mount | default('approle')
      }}/role/{{ __openbao_config_approle.name }}
    status_code: [200, 404]
  register: __openbao_config_approle_read
  no_log: true
  check_mode: false

- name: OPENBAO_CONFIG | Reconcile the application AppRole
  vars:
    __openbao_config_approle_desired:
      bind_secret_id: true
      secret_id_bound_cidrs: "{{ __openbao_config_approle.secret_id_bound_cidrs | default([]) | sort }}"
      token_bound_cidrs: "{{ __openbao_config_approle.token_bound_cidrs | default([]) | sort }}"
      token_policies: "{{ __openbao_config_approle.token_policies | sort }}"
      token_ttl: "{{ __openbao_config_approle.token_ttl | default(900) }}"
      token_max_ttl: "{{ __openbao_config_approle.token_max_ttl | default(3600) }}"
      secret_id_ttl: "{{ __openbao_config_approle.secret_id_ttl | default(0) }}"
      secret_id_num_uses: "{{ __openbao_config_approle.secret_id_num_uses | default(0) }}"
    __openbao_config_approle_current:
      bind_secret_id: "{{ __openbao_config_approle_read.json.data.bind_secret_id }}"
      secret_id_bound_cidrs: "{{ __openbao_config_approle_read.json.data.secret_id_bound_cidrs | default([], true) | sort }}"
      token_bound_cidrs: "{{ __openbao_config_approle_read.json.data.token_bound_cidrs | default([], true) | sort }}"
      token_policies: "{{ __openbao_config_approle_read.json.data.token_policies | default([], true) | sort }}"
      token_ttl: "{{ __openbao_config_approle_read.json.data.token_ttl }}"
      token_max_ttl: "{{ __openbao_config_approle_read.json.data.token_max_ttl }}"
      secret_id_ttl: "{{ __openbao_config_approle_read.json.data.secret_id_ttl }}"
      secret_id_num_uses: "{{ __openbao_config_approle_read.json.data.secret_id_num_uses }}"
  when:
    - (__openbao_config_approle.state | default('present')) == 'present'
    - __openbao_config_approle_read.status == 404 or __openbao_config_approle_current != __openbao_config_approle_desired
  block:
    - name: OPENBAO_CONFIG | Report the planned AppRole update
      ansible.builtin.debug:
        msg: "Would write AppRole {{ __openbao_config_approle.name }}."
      changed_when: true
      when: ansible_check_mode

    - name: OPENBAO_CONFIG | Write the application AppRole
      ansible.builtin.uri:
        url: >-
          {{ openbao_config_url }}/v1/auth/{{ __openbao_config_approle.mount | default('approle')
          }}/role/{{ __openbao_config_approle.name }}
        method: POST
        body: "{{ __openbao_config_approle_desired }}"
        status_code: 204
      no_log: true
      changed_when: true

- name: OPENBAO_CONFIG | Reconcile a caller-supplied Role ID
  when:
    - (__openbao_config_approle.state | default('present')) == 'present'
    - __openbao_config_approle.role_id is defined
  block:
    - name: OPENBAO_CONFIG | Read the application Role ID
      ansible.builtin.uri:
        url: >-
          {{ openbao_config_url }}/v1/auth/{{ __openbao_config_approle.mount | default('approle')
          }}/role/{{ __openbao_config_approle.name }}/role-id
        status_code: [200, 404]
      register: __openbao_config_role_id_read
      no_log: true
      check_mode: false

    - name: OPENBAO_CONFIG | Apply a changed application Role ID
      when: >-
        __openbao_config_role_id_read.status == 404
        or __openbao_config_role_id_read.json.data.role_id != __openbao_config_approle.role_id
      block:
        - name: OPENBAO_CONFIG | Report the planned Role ID update
          ansible.builtin.debug:
            msg: "Would set the Role ID of {{ __openbao_config_approle.name }}."
          changed_when: true
          when: ansible_check_mode

        - name: OPENBAO_CONFIG | Write the application Role ID
          ansible.builtin.uri:
            url: >-
              {{ openbao_config_url }}/v1/auth/{{ __openbao_config_approle.mount | default('approle')
              }}/role/{{ __openbao_config_approle.name }}/role-id
            method: POST
            body:
              role_id: "{{ __openbao_config_approle.role_id }}"
            status_code: 204
          no_log: true
          changed_when: true

- name: OPENBAO_CONFIG | Remove an explicitly absent AppRole
  when:
    - (__openbao_config_approle.state | default('present')) == 'absent'
    - __openbao_config_approle_read.status == 200
  block:
    - name: OPENBAO_CONFIG | Report the planned AppRole removal
      ansible.builtin.debug:
        msg: "Would remove AppRole {{ __openbao_config_approle.name }}."
      changed_when: true
      when: ansible_check_mode

    - name: OPENBAO_CONFIG | Delete the AppRole
      ansible.builtin.uri:
        url: >-
          {{ openbao_config_url }}/v1/auth/{{ __openbao_config_approle.mount | default('approle')
          }}/role/{{ __openbao_config_approle.name }}
        method: DELETE
        status_code: 204
      no_log: true
      changed_when: true
