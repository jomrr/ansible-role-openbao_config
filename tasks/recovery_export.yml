---
# role: openbao_config
# file: tasks/recovery_export.yml

- name: OPENBAO_CONFIG | Read the recovery configuration
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/sys/seal-status"
  register: __openbao_config_recovery_status
  no_log: true
  check_mode: false

- name: OPENBAO_CONFIG | Read an interrupted recovery export backup
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/sys/rotate/recovery/backup"
    status_code: [200, 400]
  register: __openbao_config_recovery_backup
  failed_when: >-
    __openbao_config_recovery_backup.status not in [200, 400]
    or (__openbao_config_recovery_backup.status == 400
    and __openbao_config_recovery_backup.json.errors != ['no backed-up keys found'])
  no_log: true
  check_mode: false

- name: OPENBAO_CONFIG | Inspect the recovery export directory
  ansible.builtin.stat:
    path: "{{ openbao_config_recovery_output | dirname }}"
  register: __openbao_config_recovery_directory

- name: OPENBAO_CONFIG | Require a private export directory
  ansible.builtin.assert:
    that:
      - __openbao_config_recovery_directory.stat.isdir | default(false)
      - __openbao_config_recovery_directory.stat.mode == '0700'
    fail_msg: Create the controller export directory with mode 0700 before requesting recovery keys.
    quiet: true

- name: OPENBAO_CONFIG | Inspect an existing recovery export
  ansible.builtin.stat:
    path: "{{ openbao_config_recovery_output }}"
  register: __openbao_config_recovery_file

- name: OPENBAO_CONFIG | Require an ordinary private export file
  ansible.builtin.assert:
    that:
      - __openbao_config_recovery_file.stat.isreg
      - __openbao_config_recovery_file.stat.mode == '0600'
    quiet: true
  when: __openbao_config_recovery_file.stat.exists

- name: OPENBAO_CONFIG | Read an existing recovery export
  ansible.builtin.slurp:
    src: "{{ openbao_config_recovery_output }}"
  register: __openbao_config_recovery_existing
  no_log: true
  when: __openbao_config_recovery_file.stat.exists

- name: OPENBAO_CONFIG | Verify the existing export belongs to this cluster and quorum
  ansible.builtin.assert:
    that:
      - >-
        (__openbao_config_recovery_existing.content | b64decode | from_json).cluster_id
        == __openbao_config_recovery_status.json.cluster_id
      - >-
        (__openbao_config_recovery_existing.content | b64decode | from_json).threshold
        == openbao_config_recovery_threshold
      - >-
        (__openbao_config_recovery_existing.content | b64decode | from_json).pgp_keys
        == openbao_config_recovery_pgp_keys
      - >-
        (__openbao_config_recovery_status.json.n == 0
        and 'backup' not in (__openbao_config_recovery_existing.content | b64decode | from_json))
        or (__openbao_config_recovery_status.json.n == openbao_config_recovery_pgp_keys | length
        and __openbao_config_recovery_status.json.t == openbao_config_recovery_threshold)
    quiet: true
  no_log: true
  when: __openbao_config_recovery_file.stat.exists

- name: OPENBAO_CONFIG | Refuse replacement of existing recovery keys
  ansible.builtin.assert:
    that:
      - __openbao_config_recovery_status.json.recovery_seal
      - >-
        __openbao_config_recovery_status.json.n == 0
        or (__openbao_config_recovery_file.stat.exists
        and (__openbao_config_recovery_backup.status == 200
        or 'backup' in (__openbao_config_recovery_existing.content | b64decode | from_json)))
      - __openbao_config_recovery_status.json.n != 0 or __openbao_config_recovery_backup.status == 400
      - >-
        __openbao_config_recovery_status.json.n == 0
        or (__openbao_config_recovery_status.json.n == openbao_config_recovery_pgp_keys | length
        and __openbao_config_recovery_status.json.t == openbao_config_recovery_threshold)
    fail_msg: Existing recovery keys require the matching export manifest and encrypted shares locally or in the server backup. No keys were replaced.
    quiet: true

- name: OPENBAO_CONFIG | Report the planned recovery export
  ansible.builtin.debug:
    msg: Would generate initial PGP-encrypted recovery keys or finish the interrupted export.
  changed_when: true
  when:
    - ansible_check_mode
    - __openbao_config_recovery_status.json.n == 0 or __openbao_config_recovery_backup.status == 200

- name: OPENBAO_CONFIG | Persist the recovery export
  when: not ansible_check_mode
  vars:
    __openbao_config_recovery_manifest:
      cluster_id: "{{ __openbao_config_recovery_status.json.cluster_id }}"
      threshold: "{{ openbao_config_recovery_threshold }}"
      pgp_keys: "{{ openbao_config_recovery_pgp_keys }}"
  block:
    - name: OPENBAO_CONFIG | Record the requested recipients before creating keys
      ansible.builtin.copy:
        dest: "{{ openbao_config_recovery_output }}"
        mode: "0600"
        force: false
        content: "{{ __openbao_config_recovery_manifest | to_nice_json }}"
      no_log: true
      diff: false
      when: __openbao_config_recovery_status.json.n == 0

    - name: OPENBAO_CONFIG | Generate initial recovery keys with an encrypted backup
      ansible.builtin.uri:
        url: "{{ openbao_config_url }}/v1/sys/rotate/recovery/init"
        method: POST
        body:
          secret_shares: "{{ openbao_config_recovery_pgp_keys | length }}"
          secret_threshold: "{{ openbao_config_recovery_threshold }}"
          pgp_keys: "{{ openbao_config_recovery_pgp_keys }}"
          backup: true
          require_verification: false
      no_log: true
      changed_when: true
      when: __openbao_config_recovery_status.json.n == 0

    - name: OPENBAO_CONFIG | Complete a new or interrupted export
      when: __openbao_config_recovery_status.json.n == 0 or __openbao_config_recovery_backup.status == 200
      block:
        - name: OPENBAO_CONFIG | Retrieve the encrypted recovery shares
          ansible.builtin.uri:
            url: "{{ openbao_config_url }}/v1/sys/rotate/recovery/backup"
          register: __openbao_config_recovery_export
          no_log: true

        - name: OPENBAO_CONFIG | Refuse overwriting a different recovery export
          ansible.builtin.assert:
            that:
              - >-
                (__openbao_config_recovery_existing.content | b64decode | from_json).backup
                == __openbao_config_recovery_export.json.data
            quiet: true
          no_log: true
          when:
            - __openbao_config_recovery_file.stat.exists
            - "'backup' in (__openbao_config_recovery_existing.content | b64decode | from_json)"

        - name: OPENBAO_CONFIG | Save the encrypted recovery shares atomically
          ansible.builtin.copy:
            dest: "{{ openbao_config_recovery_output }}"
            mode: "0600"
            content: >-
              {{ __openbao_config_recovery_manifest
              | combine({'backup': __openbao_config_recovery_export.json.data}) | to_nice_json }}
          no_log: true
          diff: false

        - name: OPENBAO_CONFIG | Read back the saved recovery export
          ansible.builtin.slurp:
            src: "{{ openbao_config_recovery_output }}"
          register: __openbao_config_recovery_saved
          no_log: true

        - name: OPENBAO_CONFIG | Verify the durable export before removing the backup
          ansible.builtin.assert:
            that:
              - >-
                (__openbao_config_recovery_saved.content | b64decode | from_json).backup
                == __openbao_config_recovery_export.json.data
            quiet: true
          no_log: true

        - name: OPENBAO_CONFIG | Remove the server backup after successful export
          ansible.builtin.uri:
            url: "{{ openbao_config_url }}/v1/sys/rotate/recovery/backup"
            method: DELETE
            status_code: 204
          no_log: true
          changed_when: true
