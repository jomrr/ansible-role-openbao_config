---
# role: openbao_config
# file: tasks/kv_secret.yml

- name: OPENBAO_CONFIG | Read KV metadata before changing a secret
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/{{ __openbao_config_kv_secret.mount }}/metadata/{{ __openbao_config_kv_secret.path }}"
    status_code: [200, 404]
  register: __openbao_config_kv_metadata
  no_log: true
  check_mode: false

- name: OPENBAO_CONFIG | Reconcile a present KV secret
  when: (__openbao_config_kv_secret.state | default('present')) == 'present'
  block:
    - name: OPENBAO_CONFIG | Read the current KV data
      ansible.builtin.uri:
        url: "{{ openbao_config_url }}/v1/{{ __openbao_config_kv_secret.mount }}/data/{{ __openbao_config_kv_secret.path }}"
        status_code: [200, 404]
      register: __openbao_config_kv_current
      no_log: true
      check_mode: false

    - name: OPENBAO_CONFIG | Refuse regenerating a deleted or destroyed secret
      ansible.builtin.assert:
        that:
          - __openbao_config_kv_metadata.status == 404 or __openbao_config_kv_current.status == 200
        fail_msg: >-
          KV secret {{ __openbao_config_kv_secret.mount }}/{{ __openbao_config_kv_secret.path }} has metadata
          but no readable current version. Restore it or explicitly delete its metadata before recreating it.
        quiet: true

    # The accumulator materializes random values once and is reset for each included secret.
    - name: OPENBAO_CONFIG | Prepare the secret's reconciled data
      ansible.builtin.set_fact:
        __openbao_config_kv_data: >-
          {{ __openbao_config_kv_current.json.data.data | default({})
          | combine(__openbao_config_kv_secret.data | default({}), recursive=false) }}
      no_log: true

    - name: OPENBAO_CONFIG | Generate only missing KV keys
      ansible.builtin.set_fact:
        __openbao_config_kv_data: >-
          {{ __openbao_config_kv_data | combine({__openbao_config_generate.key:
          lookup('ansible.builtin.password', '/dev/null',
          length=__openbao_config_generate.value.length | default(32),
          chars=__openbao_config_generate.value.chars | default(['ascii_letters', 'digits']))}) }}
      loop: "{{ __openbao_config_kv_secret.generate | default({}) | dict2items }}"
      loop_control:
        loop_var: __openbao_config_generate
        label: "{{ __openbao_config_generate.key }}"
      when:
        - not ansible_check_mode
        - __openbao_config_generate.key not in __openbao_config_kv_data
      no_log: true

    - name: OPENBAO_CONFIG | Apply changed KV data
      when: >-
        __openbao_config_kv_current.status == 404
        or __openbao_config_kv_data != __openbao_config_kv_current.json.data.data
        or (__openbao_config_kv_secret.generate | default({}) | list | difference(__openbao_config_kv_data)) | length > 0
      block:
        - name: OPENBAO_CONFIG | Report the planned KV write
          ansible.builtin.debug:
            msg: "Would write KV secret {{ __openbao_config_kv_secret.mount }}/{{ __openbao_config_kv_secret.path }}."
          changed_when: true
          when: ansible_check_mode

        - name: OPENBAO_CONFIG | Write changed KV data with check and set
          ansible.builtin.uri:
            url: "{{ openbao_config_url }}/v1/{{ __openbao_config_kv_secret.mount }}/data/{{ __openbao_config_kv_secret.path }}"
            method: POST
            body:
              options:
                cas: "{{ __openbao_config_kv_current.json.data.metadata.version | default(0) }}"
              data: "{{ __openbao_config_kv_data }}"
          no_log: true
          changed_when: true

- name: OPENBAO_CONFIG | Remove all versions of an absent KV secret
  when:
    - (__openbao_config_kv_secret.state | default('present')) == 'absent'
    - __openbao_config_kv_metadata.status == 200
  block:
    - name: OPENBAO_CONFIG | Report the planned KV deletion
      ansible.builtin.debug:
        msg: "Would delete all versions of {{ __openbao_config_kv_secret.mount }}/{{ __openbao_config_kv_secret.path }}."
      changed_when: true
      when: ansible_check_mode

    - name: OPENBAO_CONFIG | Delete KV metadata and all versions
      ansible.builtin.uri:
        url: "{{ openbao_config_url }}/v1/{{ __openbao_config_kv_secret.mount }}/metadata/{{ __openbao_config_kv_secret.path }}"
        method: DELETE
        status_code: 204
      no_log: true
      changed_when: true
