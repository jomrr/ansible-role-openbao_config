---
# role: openbao_config
# file: defaults/main.yml

# HTTPS API address reachable from the Ansible controller, without a trailing slash.
# openbao_config_url:
# Example: openbao_config_url: https://bao.example.org:8200

# CA bundle on the controller; the system trust store is used when omitted.
# openbao_config_ca_file:
# Example: openbao_config_ca_file: /etc/ssl/certs/internal-ca.pem

# AppRole authentication mount used by the controller.
openbao_config_auth_mount: ansible
# Example: openbao_config_auth_mount: approle

# AppRole Role ID supplied by the caller for the selected operation.
# openbao_config_role_id:
# Example: openbao_config_role_id: ansible-admin

# AppRole Secret ID supplied by the caller from Ansible Vault.
# openbao_config_secret_id:
# Example: openbao_config_secret_id: "{{ vault_openbao_management_secret_id }}"

# HTTP request timeout in seconds.
openbao_config_timeout: 30
# Example: openbao_config_timeout: 120

# ACL policies managed by name, with HCL rules and an optional present or absent state.
# Choices: state: present, absent
openbao_config_policies: []
# Example:
# openbao_config_policies:
#   - name: reader
#     rules: 'path "kv/data/app/*" { capabilities = ["read"] }'

# AppRole and userpass authentication mounts managed by path.
# Choices: type: approle, userpass; state: present, absent
openbao_config_auth_methods: []
# Example:
# openbao_config_auth_methods:
#   - {path: approle, type: approle}
#   - {path: users, type: userpass}

# KV version 2 secrets engine mounts managed by path.
# Choices: type: kv; state: present, absent
openbao_config_secrets_engines: []
# Example: openbao_config_secrets_engines: [{path: kv, type: kv}]

# AppRole definitions managed by name and mount, including their token policies.
# Choices: state: present, absent
openbao_config_approles: []
# Example:
# openbao_config_approles:
#   - name: reader
#     token_policies: [reader]
#     secret_id_bound_cidrs: [192.0.2.0/24]
#     token_bound_cidrs: [192.0.2.0/24]

# Userpass users managed by name and mount; passwords are set only on creation.
# Choices: state: present, absent
openbao_config_users: []
# Example:
# openbao_config_users:
#   - name: operator
#     mount: users
#     token_policies: [reader]
#     password: "{{ vault_openbao_operator_password }}"

# KV v2 secrets with reconciled data and generated values retained after creation.
# Choices: state: present, absent
openbao_config_kv_secrets: []
# Example:
# openbao_config_kv_secrets:
#   - mount: kv
#     path: app/database
#     generate:
#       password: {length: 40, chars: [ascii_letters, digits]}
#     data: {username: application}

# Authentication mount containing the Secret ID managed by the secret_id entry point.
openbao_config_secret_id_mount: ansible
# Example: openbao_config_secret_id_mount: approle

# AppRole containing the Secret ID managed by the secret_id entry point.
openbao_config_secret_id_role: ansible-admin
# Example: openbao_config_secret_id_role: reader

# Secret ID to register or revoke, required by the secret_id entry point.
# openbao_config_secret_id_value:
# Example: openbao_config_secret_id_value: "{{ vault_application_secret_id }}"

# Role ID required when the Secret ID state is present and login verification is enabled.
# openbao_config_secret_id_role_id:
# Example: openbao_config_secret_id_role_id: application-reader

# Verify present Secret IDs by logging in from the controller and revoking the test token.
# Choices: true, false
openbao_config_secret_id_verify: true
# Example: openbao_config_secret_id_verify: false

# Explicit operation of the secret_id entry point.
# Choices: present, absent
openbao_config_secret_id_state: present
# Example: openbao_config_secret_id_state: absent
