---
# role: openbao_config
# file: molecule/resources/playbooks/converge.yml

- name: OPENBAO_CONFIG | Converge API configuration
  hosts: all
  gather_facts: true
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    # Exercise all entry points under Molecule's real --check invocation.
    - name: OPENBAO_CONFIG | Predict changed configuration and explicit credential operations
      when: ansible_check_mode
      block:
        - name: OPENBAO_CONFIG | Predict a changed policy without writing it
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            openbao_config_policies:
              - name: application
                rules: 'path "kv/data/app/*" { capabilities = ["deny"] }'

        - name: OPENBAO_CONFIG | Predict Secret ID registration without creating a credential
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
            tasks_from: secret_id
          vars:
            openbao_config_secret_id_mount: approle
            openbao_config_secret_id_role: application
            openbao_config_secret_id_role_id: molecule-application
            openbao_config_secret_id_value: molecule-application-secret-id-not-for-production

        - name: OPENBAO_CONFIG | Predict generated KV data and user creation
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            openbao_config_kv_secrets:
              - {mount: kv, path: app/check-only, generate: {password: {}}}
            openbao_config_users:
              - {name: check-only, mount: users, token_policies: [reader], password: check-only-password}
