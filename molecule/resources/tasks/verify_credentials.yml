---
# role: openbao_config
# file: molecule/resources/tasks/verify_credentials.yml

- name: OPENBAO_CONFIG | Assert check mode did not register a credential
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/auth/approle/role/application/secret-id/lookup"
    method: POST
    body:
      secret_id: molecule-application-secret-id-not-for-production
    status_code: [204, 404]
  no_log: true

- name: OPENBAO_CONFIG | Register and verify an application credential
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    tasks_from: secret_id
  vars:
    openbao_config_secret_id_mount: approle
    openbao_config_secret_id_role: application
    openbao_config_secret_id_role_id: molecule-application
    openbao_config_secret_id_value: molecule-application-secret-id-not-for-production

- name: OPENBAO_CONFIG | Log in as the application
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/auth/approle/login"
    method: POST
    body:
      role_id: molecule-application
      secret_id: molecule-application-secret-id-not-for-production
  register: __openbao_config_test_application
  no_log: true

- name: OPENBAO_CONFIG | Write an allowed KV v2 value
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/kv/data/app/example"
    method: POST
    body:
      data:
        value: integration-test
    headers:
      X-Vault-Token: "{{ __openbao_config_test_application.json.auth.client_token }}"
  no_log: true

- name: OPENBAO_CONFIG | Verify application access is scoped
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/kv/data/other/example"
    method: POST
    body:
      data:
        value: forbidden
    headers:
      X-Vault-Token: "{{ __openbao_config_test_application.json.auth.client_token }}"
    status_code: 403
  no_log: true

- name: OPENBAO_CONFIG | Revoke the application test token
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/auth/token/revoke-self"
    method: POST
    headers:
      X-Vault-Token: "{{ __openbao_config_test_application.json.auth.client_token }}"
    status_code: 204
  no_log: true

- name: OPENBAO_CONFIG | Register a replacement management Secret ID
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    tasks_from: secret_id
  vars:
    openbao_config_secret_id_role_id: molecule-controller
    openbao_config_secret_id_value: molecule-replacement-secret-id-not-for-production

- name: OPENBAO_CONFIG | Repeat registration with the old credential still valid
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    tasks_from: secret_id
  vars:
    openbao_config_secret_id_role_id: molecule-controller
    openbao_config_secret_id_value: molecule-replacement-secret-id-not-for-production

- name: OPENBAO_CONFIG | Switch credentials and explicitly revoke the old Secret ID
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    tasks_from: secret_id
  vars:
    openbao_config_secret_id: molecule-replacement-secret-id-not-for-production
    openbao_config_secret_id_value: molecule-management-secret-id-not-for-production
    openbao_config_secret_id_state: absent

- name: OPENBAO_CONFIG | Assert the revoked Secret ID cannot log in
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/auth/ansible/login"
    method: POST
    body:
      role_id: molecule-controller
      secret_id: molecule-management-secret-id-not-for-production
    status_code: 400
  no_log: true

- name: OPENBAO_CONFIG | Confirm convergence with the replacement credential
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  vars:
    openbao_config_secret_id: molecule-replacement-secret-id-not-for-production
