---
# role: openbao_config
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Manage OpenBao configuration from the Ansible controller.
    description:
      - Reconciles declared API resources using short-lived AppRole sessions and verified
        HTTPS connections.
      - Provides an explicit secret_id entry point; existing generated secrets and user
        passwords are preserved.
    options:
      openbao_config_url:
        type: str
        required: true
        description:
          - HTTPS API origin reachable from the controller, without a trailing slash or
            path.
      openbao_config_ca_file:
        type: path
        description:
          - CA bundle on the controller; omitted to use the controller's system trust store.
      openbao_config_auth_mount:
        type: str
        default: ansible
        description:
          - Authentication mount of the caller-supplied AppRole.
      openbao_config_role_id:
        type: str
        required: true
        description:
          - Role ID of the caller-supplied AppRole for the selected operation.
      openbao_config_secret_id:
        type: str
        required: true
        no_log: true
        description:
          - Caller-supplied AppRole Secret ID from Ansible Vault outside this OpenBao instance.
      openbao_config_timeout:
        type: int
        default: 30
        description:
          - HTTP request timeout in seconds.
      openbao_config_policies:
        type: list
        elements: dict
        default: []
        description:
          - ACL policies managed by name; omitted policies are preserved.
        options:
          name:
            type: str
            required: true
            description:
              - Policy name; root, default and ansible-admin are reserved.
          rules:
            type: str
            description:
              - HCL policy body, required when the effective state is present.
          state:
            type: str
            choices:
              - present
              - absent
            default: present
            description:
              - Desired policy state; defaults to present.
      openbao_config_auth_methods:
        type: list
        elements: dict
        default: []
        description:
          - AppRole and userpass authentication mounts; deletion also removes their identities
            and credentials.
        options:
          path:
            type: str
            required: true
            description:
              - Single mount component using lowercase letters, digits, underscores and
                hyphens.
          type:
            type: str
            required: true
            choices:
              - approle
              - userpass
            description:
              - Authentication backend type.
          description:
            type: str
            description:
              - Mount description; defaults to an empty string.
          default_lease_ttl:
            type: int
            default: 0
            description:
              - Lease TTL override in seconds; defaults to 0 to inherit the server default.
          max_lease_ttl:
            type: int
            default: 0
            description:
              - Maximum lease TTL override in seconds; defaults to 0 to inherit the server
                default.
          state:
            type: str
            choices:
              - present
              - absent
            default: present
            description:
              - Desired mount state; defaults to present.
      openbao_config_secrets_engines:
        type: list
        elements: dict
        default: []
        description:
          - KV version 2 mounts; deletion permanently removes the mount and its secrets.
        options:
          path:
            type: str
            required: true
            description:
              - Single mount component using lowercase letters, digits, underscores and
                hyphens.
          type:
            type: str
            required: true
            choices:
              - kv
            description:
              - Secrets backend type; currently kv with version 2.
          description:
            type: str
            description:
              - Mount description; defaults to an empty string.
          default_lease_ttl:
            type: int
            default: 0
            description:
              - Lease TTL override in seconds; defaults to 0 to inherit the server default.
          max_lease_ttl:
            type: int
            default: 0
            description:
              - Maximum lease TTL override in seconds; defaults to 0 to inherit the server
                default.
          state:
            type: str
            choices:
              - present
              - absent
            default: present
            description:
              - Desired mount state; defaults to present.
      openbao_config_approles:
        type: list
        elements: dict
        default: []
        description:
          - Application AppRoles; Secret IDs are managed only through the explicit secret_id
            entry point.
        options:
          name:
            type: str
            required: true
            description:
              - AppRole name within the selected mount.
          mount:
            type: str
            default: approle
            description:
              - Authentication mount; defaults to approle.
          role_id:
            type: str
            description:
              - Optional explicit Role ID; OpenBao assigns one when omitted for a new role.
          token_policies:
            type: list
            elements: str
            description:
              - Policies granted at login, required when the effective state is present.
          token_ttl:
            type: int
            default: 900
            description:
              - Initial token TTL override in seconds; defaults to 900.
          token_max_ttl:
            type: int
            default: 3600
            description:
              - Maximum token TTL override in seconds; defaults to 3600.
          secret_id_ttl:
            type: int
            default: 0
            description:
              - Secret ID TTL override in seconds; defaults to 0 for no expiry.
          secret_id_num_uses:
            type: int
            default: 0
            description:
              - Secret ID login limit override; defaults to 0 for unlimited use.
          secret_id_bound_cidrs:
            type: list
            elements: str
            default: []
            description:
              - Allowed Secret ID source networks; defaults to an empty list without source
                restrictions.
              - Use API-formatted networks or bare host addresses; /32 and /128 host suffixes
                are rejected.
          token_bound_cidrs:
            type: list
            elements: str
            default: []
            description:
              - Allowed token source networks; defaults to an empty list without source
                restrictions.
              - Use API-formatted networks or bare host addresses; /32 and /128 host suffixes
                are rejected.
          state:
            type: str
            choices:
              - present
              - absent
            default: present
            description:
              - Desired AppRole state; defaults to present.
      openbao_config_users:
        type: list
        elements: dict
        default: []
        description:
          - Userpass users; passwords are set only at creation and omitted users are preserved.
        options:
          name:
            type: str
            required: true
            description:
              - Lowercase user name within the selected mount.
          mount:
            type: str
            required: true
            description:
              - Single mount component using lowercase letters, digits, underscores and
                hyphens.
          token_policies:
            type: list
            elements: str
            description:
              - Policies granted at login, required when the effective state is present.
          password:
            type: str
            no_log: true
            description:
              - Required only for a new user; never sent when updating an existing user.
          token_bound_cidrs:
            type: list
            elements: str
            default: []
            description:
              - Allowed token source networks; defaults to an empty list without source
                restrictions.
              - Use API-formatted networks or bare host addresses; /32 and /128 host suffixes
                are rejected.
          state:
            type: str
            choices:
              - present
              - absent
            default: present
            description:
              - Desired user state; defaults to present.
      openbao_config_kv_secrets:
        type: list
        elements: dict
        default: []
        description:
          - KV v2 secrets with reconciled data and generated values; writes use check and
            set.
        options:
          mount:
            type: str
            required: true
            description:
              - Single mount component using lowercase letters, digits, underscores and
                hyphens.
          path:
            type: str
            required: true
            description:
              - Relative secret path with slash-separated components; no leading slash or
                traversal components.
          generate:
            type: dict
            default: {}
            description:
              - Mapping of key names to optional length and chars settings; only missing
                keys are generated.
              - Per-key length defaults to 32; chars defaults to [ascii_letters, digits].
          data:
            type: dict
            default: {}
            no_log: true
            description:
              - Values reconciled on every run; additional keys are preserved and generate
                keys must not overlap.
          state:
            type: str
            choices:
              - present
              - absent
            default: present
            description:
              - Desired secret state; defaults to present. Absent deletes metadata and all
                versions.
      openbao_config_secret_id_mount:
        type: str
        default: ansible
        description:
          - AppRole mount used by the secret_id entry point.
      openbao_config_secret_id_role:
        type: str
        default: ansible-admin
        description:
          - AppRole name used by the secret_id entry point.
      openbao_config_secret_id_value:
        type: str
        no_log: true
        description:
          - Required by secret_id; random Secret ID of at least 32 characters to register
            or revoke.
      openbao_config_secret_id_role_id:
        type: str
        description:
          - Required by secret_id when state is present and openbao_config_secret_id_verify
            is true.
      openbao_config_secret_id_verify:
        type: bool
        default: true
        description:
          - Log in from the controller with a present Secret ID and revoke the verification
            token.
          - Disable explicitly when the controller is outside the application AppRole's
            allowed source networks.
      openbao_config_secret_id_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - Explicit secret_id operation; present registers and optionally verifies, absent
            revokes the selected credential.
